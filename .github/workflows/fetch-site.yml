name: fetch-site
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fetch-site.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dump && cd dump
          wget -m -p -E -e robots=off --no-parent -U "Mozilla/5.0" https://relax-mind.uz/ || true
          for f in robots.txt sitemap.xml favicon.ico favicon.png favicon.svg apple-touch-icon.png manifest.json site.webmanifest; do wget -q -x -e robots=off -U "Mozilla/5.0" https://relax-mind.uz/$f || true; done
          curl -sSIL https://relax-mind.uz/ > ../headers.txt || true
          find . -type f | sort > ../filelist.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Download current relax-mind.uz files"
          git push
